# ==============================
# CẤU HÌNH ỨNG DỤNG & SERVER
# ==============================
spring.application.name=qlykho
server.port=8080
app.jwt.secret=${JWT_SECRET}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.bootstrap-admin.username=${APP_BOOTSTRAP_ADMIN_USERNAME:adminso1}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:Admin@123}
app.bootstrap-admin.ho-ten=${APP_BOOTSTRAP_ADMIN_HO_TEN:Quản trị viên}
app.bootstrap-admin.gioi-tinh=${APP_BOOTSTRAP_ADMIN_GIOI_TINH:Khác}
app.bootstrap-admin.ngay-sinh=${APP_BOOTSTRAP_ADMIN_NGAY_SINH:1990-01-01}
app.bootstrap-admin.so-dien-thoai=${APP_BOOTSTRAP_ADMIN_SO_DIEN_THOAI:0900000001}
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:adminso1@qlykho.local}
app.bootstrap-admin.dia-chi=${APP_BOOTSTRAP_ADMIN_DIA_CHI:Chưa cập nhật}

# ==============================
# KẾT NỐI CƠ SỞ DỮ LIỆU (MYSQL)
# ==============================
# Sử dụng biến môi trường DB_URL, nếu không có sẽ lấy cấu hình mặc định phía sau dấu ":"
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/qlykho?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / HIBERNATE
# ==============================
# Đổi 'update' thành 'none' khi lên môi trường Production thật
spring.jpa.hibernate.ddl-auto=update

# Giữ nguyên tên thuộc tính trong Java sang tên cột Database (không tự động chèn gạch dưới _)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Hiển thị và định dạng câu lệnh SQL ra Terminal/Console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# THYMELEAF
# ==============================
# Tắt cache để khi sửa HTML/CSS nhấn F5 là cập nhật ngay
spring.thymeleaf.cache=false

